name: Drone Racer CI and GitHub Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drone-racer-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax-check source and tests
        run: |
          set -euo pipefail
          for f in src/*.js engine/*/*.js scripts/*.mjs tests/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Build allowlisted offline site
        run: node scripts/site.mjs build _site
      - name: Verify SHA-256 static asset inventory
        run: node scripts/site.mjs verify _site
      - name: Install isolated browser test tooling
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/drone-browser" --ignore-scripts --no-save --package-lock=false --no-audit --no-fund playwright@1.64.0
          node "$RUNNER_TEMP/drone-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
      - name: Packaged Chromium and software WebGPU parity
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/drone-browser/node_modules/playwright
          DRONE_BROWSER_REPORT: ${{ runner.temp }}/drone-browser-report.json
        run: node scripts/browser-check.mjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drone-browser-evidence
          retention-days: 7
          path: |
            /tmp/drone-racer-desktop.png
            /tmp/drone-racer-mobile.png
            ${{ runner.temp }}/drone-browser-report.json
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
